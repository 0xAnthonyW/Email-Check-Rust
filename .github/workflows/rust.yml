name: Rust Console CI/CD

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""

    env:
      BIN_NAME: email-check-rust

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust (stable) with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # copy artefact into dist directory (platform‑specific)
      - name: Prepare artefact directory (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}${{ matrix.ext }}" dist/

      - name: Prepare artefact directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ env.BIN_NAME }}${{ matrix.ext }}" dist\

      # compress artefact
      - name: Compress artefact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          zip -r "../${{ env.BIN_NAME }}-${{ matrix.target }}.zip" *

      - name: Compress artefact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath "${{ env.BIN_NAME }}-${{ matrix.target }}.zip"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "release-${{ github.run_number }}-${{ matrix.target }}-${{ github.sha }}"
          release_name: "Email-Check-Rust ${{ github.run_number }} (${{ matrix.target }})"
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: "${{ env.BIN_NAME }}-${{ matrix.target }}.zip"
          asset_name: "${{ env.BIN_NAME }}-${{ matrix.target }}.zip"
          asset_content_type: application/zip
