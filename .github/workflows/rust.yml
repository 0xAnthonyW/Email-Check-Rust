name: Rust Console CI/CD

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""

    env:
      BIN_NAME: email-check-rust
      BUILD_DIR: target/${{ matrix.target }}/release
      ZIP_NAME: email-check-rust-${{ matrix.target }}.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust (stable) with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artefact directory
        shell: bash
        run: |
          mkdir dist
          cp "${{ env.BUILD_DIR }}/${{ env.BIN_NAME }}${{ matrix.ext }}" "dist/"

      - name: Compress artefact
        shell: bash
        run: |
          cd dist
          zip -r "../${{ env.ZIP_NAME }}" *

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "release-${{ github.run_number }}-${{ matrix.target }}-${{ github.sha }}"
          release_name: "Email-Check-Rust ${{ github.run_number }} (${{ matrix.target }})"
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./${{ env.ZIP_NAME }}
          asset_name: ${{ env.ZIP_NAME }}
          asset_content_type: application/zip
